name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check
        if: runner.os != 'Windows'
        run: make check
      - name: Check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.go | Select-Object -ExpandProperty FullName
          $unformatted = gofmt -l $files
          if ($unformatted) { throw "Unformatted Go files: $unformatted" }
          go mod tidy -diff
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet -tags=live ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -count=1 -timeout=2m ./internal/api -run TestOperationsMatchReleasedSchemas
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build ./...
          exit $LASTEXITCODE

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Audit workflows and dependencies
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pipx run zizmor==1.30.1 --no-progress .github/workflows
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Check source complexity
        uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1.1.2
        with:
          version: v1.8.0
          path: cmd internal pkg
          config: cccc.toml
          top-cognitive: '10'
      - name: Lint Go
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - name: Read release version
        id: release-version
        run: echo "version=$(cat .goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.release-version.outputs.version }}
          install-only: true
      - name: Validate release configuration
        run: goreleaser check
